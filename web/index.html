<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WKF · 股票K线智能分析</title>
<style>
  /* ================= 全局（深色金融风格） ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0f1419; --panel: #171d26; --panel2: #1e2632; --border: #2a3442;
    --text: #e6edf3; --dim: #8b949e; --red: #ef4444; --green: #22c55e;
    --accent: #3b82f6; --accent2: #8b5cf6;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px; overflow: hidden;
  }
  /* 内容上下留白，避免被底部固定免责声明遮挡 */
  #app { height: 100%; display: flex; flex-direction: column; padding-bottom: 34px; }

  /* ================= 顶栏 ================= */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 15px; font-weight: 700; margin-right: 6px; }
  header h1 em { font-style: normal; color: var(--accent2); }
  select, button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .spacer { flex: 1; }
  #dataStatus { font-size: 12px; color: var(--dim); }
  .zoom-btn { padding: 5px 9px; font-weight: 700; }

  /* ================= 主体 ================= */
  main { flex: 1; display: flex; min-height: 0; }

  /* --- 左：K线图表 --- */
  #chartCol { flex: 1.7; display: flex; flex-direction: column; min-width: 320px; border-right: 1px solid var(--border); }
  #chartHead {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 12px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--border);
  }
  #chartWrap { position: relative; flex: none; }
  canvas#kline { display: block; width: 100%; height: 440px; cursor: crosshair; }
  /* 高度拖拽手柄：横向拖动条，可自由调整图表高度 */
  #resizeHandle {
    height: 8px; background: var(--panel2); border-top: 1px solid var(--border);
    cursor: ns-resize; display: flex; align-items: center; justify-content: center;
    user-select: none; color: var(--dim); font-size: 10px;
  }
  #resizeHandle:hover, #resizeHandle.active { background: #263244; color: var(--accent); }
  /* 图表浮层 tooltip（跟随鼠标） */
  #tooltip {
    position: absolute; pointer-events: none; display: none; z-index: 10;
    background: rgba(10,14,20,.92); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 9px; font-size: 12px; line-height: 1.6; white-space: nowrap;
  }
  #tooltip .up { color: var(--red); } #tooltip .down { color: var(--green); }

  /* --- 统计条（分析结果，位于图表下方） --- */
  #statsBar {
    display: flex; gap: 18px; flex-wrap: wrap; padding: 8px 14px;
    background: var(--panel); border-top: 1px solid var(--border); font-size: 13px;
  }
  #statsBar .item { display: flex; flex-direction: column; gap: 2px; }
  #statsBar .k { color: var(--dim); font-size: 11px; }
  #statsBar .v { font-weight: 700; }
  #statsBar .v.up { color: var(--red); } #statsBar .v.down { color: var(--green); }

  /* --- 右：AI 对话 --- */
  #chatCol { flex: 1; display: flex; flex-direction: column; min-width: 300px; }
  #chatHead { padding: 8px 14px; font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); background: var(--panel); }
  #chatHead span { color: var(--dim); font-weight: 400; font-size: 11px; margin-left: 8px; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; line-height: 1.65; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .msg.ai { align-self: flex-start; background: var(--panel2); border: 1px solid var(--border); }
  .msg.err { align-self: flex-start; background: #2a1a1a; border: 1px solid #7f1d1d; color: #fca5a5; }
  .msg .label { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  details.reasoning { margin-top: 6px; border-top: 1px dashed var(--border); padding-top: 6px; }
  details.reasoning summary { cursor: pointer; color: var(--accent2); font-size: 12px; }
  details.reasoning .rc-body { color: var(--dim); font-size: 12px; margin-top: 4px; white-space: pre-wrap; }
  .thinking { color: var(--accent); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  #inputBar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--border); background: var(--panel); }
  #question { flex: 1; resize: none; height: 56px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  #question:focus { outline: none; border-color: var(--accent); }
  #sendBtn { width: 72px; background: var(--accent); color: #fff; border: none; font-weight: 700; }
  #sendBtn:hover { background: #2563eb; }
  #sendBtn:disabled { background: #334155; }

  /* ================= 免责声明（固定底部显示） ================= */
  footer.disclaimer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
    padding: 8px 14px; text-align: center;
    background: #131a22; border-top: 1px solid var(--border);
    color: #f59e0b; font-size: 13px; font-weight: 700; letter-spacing: .5px;
  }

  /* 窄屏适配 */
  @media (max-width: 900px) { main { flex-direction: column; } #chartCol { border-right: none; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body>
<div id="app">
  <!-- ================= 顶栏 ================= -->
  <header>
    <h1>WKF · <em>股票K线智能分析</em></h1>
    <label>品种
      <select id="symbolSel">
        <option value="NQ1!">NQ 纳指100</option>
        <option value="ES1!">ES 标普500</option>
        <option value="GC1!">XAU 黄金</option>
      </select>
    </label>
    <label>周期
      <select id="tfSel">
        <option value="5m">5m</option><option value="10m">10m</option>
        <option value="15m" selected>15m</option>
        <option value="30m">30m</option><option value="1h">1h</option>
      </select>
    </label>
    <button id="refreshBtn">🔄 刷新数据</button>
    <span class="spacer"></span>
    <span class="zoom-btn" style="color:var(--dim)">图表缩放:</span>
    <button class="zoom-btn" id="zoomOut">−</button>
    <span id="candleInfo" style="font-size:12px;color:var(--dim)">8px/根</span>
    <button class="zoom-btn" id="zoomIn">＋</button>
    <span id="dataStatus">加载中…</span>
  </header>

  <main>
    <!-- ================= 左：K线图表 ================= -->
    <section id="chartCol">
      <div id="chartHead">
        <span id="chartTitle">NQ1! · 15m</span>
        <span>拖动图表下方横条可调整高度 · 滚轮缩放 · 拖动图表可平移</span>
      </div>
      <div id="chartWrap">
        <canvas id="kline"></canvas>
        <div id="tooltip"></div>
      </div>
      <div id="resizeHandle">⣿ 拖动调整图表高度 ⣿</div>

      <!-- 分析结果：基于真实K线计算的统计快照 -->
      <div id="statsBar"></div>
    </section>

    <!-- ================= 右：AI 对话 ================= -->
    <section id="chatCol">
      <div id="chatHead">🤖 问 AI <span>回答基于页面真实K线数据 · 概率分析采用审慎语气</span></div>
      <div id="messages"></div>
      <div id="inputBar">
        <textarea id="question" placeholder="输入问题，例如：基于当前K线，分析未来走势概率…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="sendBtn">发送</button>
      </div>
    </section>
  </main>
</div>

<!-- ================= 免责声明：固定显示在页面末尾 ================= -->
<footer class="disclaimer">⚠ 以上仅是王先生的分析，仅做参考，不可以作为价值投资。</footer>

<script>
"use strict";
/* ============================================================================
 * WKF 股票K线分析页面 —— 前端逻辑
 * ============================================================================
 *
 * ██ 一、蜡烛图"只渲染成一条横向直线"的常见根因与本页面的修复对策 ██
 *
 * 根因1【数据格式错误 / NaN 泄漏】
 *   服务端或解析层字段缺失（如取了 close 而数据实际是 "Close"），或序列里混入
 *   NaN，导致所有 close 变成同一个值 → 所有蜡烛压在同一条水平线上。
 *   修复：服务端输出前已 round 并剔除 NaN；前端绘制前再次防御：
 *         `if (!isFinite(v)) v = 上一有效值`，见 sanitize()。
 *
 * 根因2【时间序列解析错误】
 *   时间戳单位混淆（把毫秒当秒、或 Date 解析失败）→ 所有 x 坐标相等 → 蜡烛全
 *   部重叠成一条竖/横线。本页面 x 轴按【索引】线性映射（第 i 根 -> i 的位置），
 *   时间戳仅用于 tooltip 展示，从根源上杜绝"时间解析失败导致坐标坍缩"。
 *
 * 根因3【坐标轴映射错误：价格区间用错字段】
 *   只用 close 序列求 min/max，而收盘价恰好平 → 价格范围 (maxP-minP)=0 →
 *   y 映射除零，所有蜡烛被画到同一行。修复：价格范围取窗口内所有
 *   high 与 low（及均线），并在 maxP==minP 或非有限值时强制扩展 ±0.5% 兜底，
 *   见 computePriceRange()。
 *
 * 根因4【渲染循环索引错位】
 *   循环里用全局索引访问切分后的子数组（slice 后 i 越界/错位）→ 画出的蜡烛
 *   位置错误或只画最后一根。修复：统一用 `view[i]` 相对索引 + 独立 x 映射，
 *   见 renderChart() 中的 for 循环。
 *
 * 根因5【Canvas 坐标翻转 / 分辨率】
 *   y 轴向上为正，但 Canvas 原点在左上角；同时高分屏需 devicePixelRatio 缩放，
 *   否则线条模糊或整体偏移。修复：y = top + (maxP-p)/(maxP-minP)*h；并用
 *   dpr 缩放画布，见 setupCanvas()。
 * ========================================================================== */

/* ---------------- 全局状态 ---------------- */
const state = {
  data: [],            // 全部K线（旧 -> 新），元素: {t,ts,o,h,l,c,v,ma5,ma20}
  stats: null,         // 统计快照 {last_close, change, change_pct, high20, low20, rsi14, vwap, ma5, ma20}
  candleW: 8,          // 每根蜡烛像素宽（缩放控制，2~40）
  viewStart: 0,        // 可见窗口最左索引（平移/缩放用）
  chartHeight: 440,    // 图表高度（可拖拽调整）
  dragging: null,      // 拖拽状态 {mode:'height'|'pan', startX, startY, startH, startView}
};

const $ = (id) => document.getElementById(id);
const canvas = $("kline");
const ctx = canvas.getContext("2d");

/* ---------------- 数据加载（GET /api/kline，真实MT5数据） ---------------- */
async function loadData() {
  const symbol = $("symbolSel").value;
  const tf = $("tfSel").value;
  $("dataStatus").textContent = "⏳ 加载数据…";
  $("refreshBtn").disabled = true;
  try {
    const resp = await fetch(`/api/kline?symbol=${encodeURIComponent(symbol)}&timeframe=${tf}&count=150`);
    const json = await resp.json();
    if (!resp.ok) throw new Error(json.error || `HTTP ${resp.status}`);
    state.data = json.items;
    state.stats = json.stats;
    state.viewStart = 0;                       // 加载后默认显示全部
    state.candleW = Math.min(8, Math.max(3, Math.floor(chartPlotWidth() / state.data.length)));
    $("chartTitle").textContent = `${json.stats.symbol} · ${tf}`;
    renderStats();
    renderChart();
    $("dataStatus").textContent = `✅ ${state.data.length}根K线 · ${json.stats.updated_at}`;
  } catch (e) {
    $("dataStatus").textContent = `❌ ${e.message}`;
  } finally {
    $("refreshBtn").disabled = false;
  }
}

/* ---------------- 统计条渲染（真实数据计算结果） ---------------- */
function renderStats() {
  const s = state.stats;
  if (!s) return;
  const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");
  const sign = (v) => (v > 0 ? "+" : "");
  $("statsBar").innerHTML = `
    <div class="item"><span class="k">最新收盘</span><span class="v">${s.last_close.toFixed(2)}</span></div>
    <div class="item"><span class="k">涨跌</span><span class="v ${cls(s.change)}">${sign(s.change)}${s.change.toFixed(2)} (${sign(s.change_pct)}${s.change_pct}%)</span></div>
    <div class="item"><span class="k">近20根区间</span><span class="v">${s.low20.toFixed(2)} ~ ${s.high20.toFixed(2)}</span></div>
    <div class="item"><span class="k">RSI14</span><span class="v">${s.rsi14 ?? "—"}</span></div>
    <div class="item"><span class="k">VWAP</span><span class="v">${s.vwap ?? "—"}</span></div>
    <div class="item"><span class="k">MA5 / MA20</span><span class="v">${s.ma5 ?? "—"} / ${s.ma20 ?? "—"}</span></div>
  `;
}

/* ---------------- 画布设置（高清适配，修复根因5） ---------------- */
function setupCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || chartPlotWidth();
  const h = state.chartHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  return { w, h };
}

function chartPlotWidth() { return canvas.clientWidth || 800; }

/* ---------------- 防御性数据清洗（修复根因1） ---------------- */
function sanitize(arr) {
  const out = [];
  for (const b of arr) {
    out.push({
      t: b.t || "", ts: b.ts || 0,
      o: isFinite(b.o) ? b.o : (out.length ? out[out.length - 1].c : 0),
      h: isFinite(b.h) ? b.h : (out.length ? out[out.length - 1].h : 0),
      l: isFinite(b.l) ? b.l : (out.length ? out[out.length - 1].l : 0),
      c: isFinite(b.c) ? b.c : (out.length ? out[out.length - 1].c : 0),
      v: isFinite(b.v) ? b.v : 0,
      ma5: isFinite(b.ma5) ? b.ma5 : null,
      ma20: isFinite(b.ma20) ? b.ma20 : null,
    });
  }
  return out;
}

/* ---------------- 价格区间（修复根因3） ----------------
 * 只依据真实 high/low/均线，绝不用"所有 close 相同"时的假区间；
 * 区间为零或无效时强制扩展 ±0.5%，避免除零导致的水平线。 */
function computePriceRange(view) {
  let minP = Infinity, maxP = -Infinity;
  for (const b of view) {
    if (b.h < minP) minP = b.h;
    if (b.l > maxP) maxP = b.l;
    if (b.ma5 != null) { minP = Math.min(minP, b.ma5); maxP = Math.max(maxP, b.ma5); }
    if (b.ma20 != null) { minP = Math.min(minP, b.ma20); maxP = Math.max(maxP, b.ma20); }
  }
  if (!isFinite(minP) || !isFinite(maxP)) return [0, 1];      // 无有效数据兜底
  if (maxP <= minP) {                                        // 区间为零（理论横盘）
    const pad = (Math.abs(minP) || 1) * 0.005;
    minP -= pad; maxP += pad;
  } else {
    const pad = (maxP - minP) * 0.05;                        // 上下留 5% 边距
    minP -= pad; maxP += pad;
  }
  return [minP, maxP];
}

/* ---------------- 渲染主函数 ----------------
 * 布局（自上而下）：标题区 24px / 价格区(自适应) / 时间轴 22px / 成交量 15%
 * x 按索引映射（修复根因2），y 由价格区间映射（修复根因3）。 */
function renderChart() {
  if (!state.data.length) return;
  const data = sanitize(state.data);
  const { w, h } = setupCanvas();
  const padL = 62, padR = 14, padT = 26, padB = 62;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const volH = plotH * 0.15;                        // 底部成交量区
  const priceH = plotH - volH - 18;                 // 价格区

  // 可见窗口计算（缩放/平移）
  const n = data.length;
  const maxVisible = Math.max(4, Math.floor(plotW / state.candleW));
  if (maxVisible >= n) {
    state.viewStart = 0;
  } else {
    state.viewStart = Math.max(0, Math.min(state.viewStart, n - maxVisible));
  }
  const viewStart = state.viewStart;
  const viewEnd = Math.min(viewStart + maxVisible, n);
  const view = data.slice(viewStart, viewEnd);

  // 坐标映射
  const [minP, maxP] = computePriceRange(view);
  const xAt = (i) => padL + (i - viewStart + 0.5) * state.candleW;
  const yAt = (p) => padT + ((maxP - p) / (maxP - minP)) * priceH;

  // ── 背景与网格 ──
  ctx.fillStyle = "#0f1419";
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#1c2530";
  ctx.lineWidth = 1;
  const gridN = 6;
  for (let g = 0; g <= gridN; g++) {
    const py = padT + (g / gridN) * priceH;
    ctx.beginPath(); ctx.moveTo(padL, py); ctx.lineTo(w - padR, py); ctx.stroke();
    const pv = maxP - (g / gridN) * (maxP - minP);
    ctx.fillStyle = "#8b949e"; ctx.font = "11px monospace"; ctx.textAlign = "right";
    ctx.fillText(pv.toFixed(2), padL - 6, py + 4);
  }
  // 时间轴（每约80px一根刻度，避免标签重叠）
  ctx.fillStyle = "#8b949e"; ctx.textAlign = "center";
  const tickStep = Math.max(1, Math.ceil(80 / state.candleW));
  for (let i = viewStart; i < viewEnd; i += tickStep) {
    ctx.fillText(String(data[i].t).slice(5, 16), xAt(i), h - 18);   // "MM-DD HH:MM"
  }
  // 成交量与价格区分隔线
  ctx.strokeStyle = "#2a3442";
  ctx.beginPath(); ctx.moveTo(padL, padT + priceH + 14); ctx.lineTo(w - padR, padT + priceH + 14); ctx.stroke();

  // ── 蜡烛绘制（修复根因4：相对索引 + 独立映射）──
  const cw = Math.max(1, state.candleW - 1);       // 蜡烛实体宽 = 步长 - 1px 间隔
  for (let i = 0; i < view.length; i++) {
    const b = view[i];
    const x = xAt(viewStart + i);
    const up = b.c >= b.o;                          // 中国习惯：涨=红，跌=绿
    const color = up ? "#ef4444" : "#22c55e";
    // 影线（high-low）
    ctx.strokeStyle = color; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, yAt(b.h)); ctx.lineTo(x, yAt(b.l)); ctx.stroke();
    // 实体（open-close），最低1px可见
    const yo = yAt(b.o), yc = yAt(b.c);
    const bodyTop = Math.min(yo, yc), bodyH = Math.max(1, Math.abs(yo - yc));
    ctx.fillStyle = color;
    ctx.fillRect(x - cw / 2, bodyTop, cw, bodyH);
    // 成交量（底部区域，按窗口内最大量归一化）
    const vh = (b.v / (Math.max(...view.map(v => v.v)) || 1)) * volH;
    ctx.fillStyle = up ? "rgba(239,68,68,.45)" : "rgba(34,197,94,.45)";
    ctx.fillRect(x - cw / 2, padT + priceH + 18, cw, Math.max(1, vh));
  }

  // ── 均线（MA5 / MA20 折线）──
  drawMA(view, viewStart, xAt, yAt, (b) => b.ma5, "#f59e0b");
  drawMA(view, viewStart, xAt, yAt, (b) => b.ma20, "#3b82f6");
  // 图例
  ctx.textAlign = "left"; ctx.font = "11px sans-serif";
  const last = view[view.length - 1];
  ctx.fillStyle = "#f59e0b";
  ctx.fillText(`MA5 ${last.ma5 != null ? last.ma5.toFixed(2) : "—"}`, padL + 4, 14);
  ctx.fillStyle = "#3b82f6";
  ctx.fillText(`MA20 ${last.ma20 != null ? last.ma20.toFixed(2) : "—"}`, padL + 90, 14);
  ctx.fillStyle = "#8b949e";
  ctx.fillText(`${state.stats ? state.stats.symbol + " " + state.stats.timeframe : ""}  高${maxP.toFixed(2)} 低${minP.toFixed(2)}`, padL + 180, 14);

  // ── 十字光标与信息浮层 ──
  if (state.crosshair) drawCrosshair(view, viewStart, viewEnd, xAt, yAt, w, h, padL, padR);
}

function drawMA(view, viewStart, xAt, yAt, getter, color) {
  ctx.strokeStyle = color; ctx.lineWidth = 1.4; ctx.beginPath();
  let started = false;
  for (let i = 0; i < view.length; i++) {
    const v = getter(view[i]);
    if (v == null) continue;
    const x = xAt(viewStart + i), y = yAt(v);
    if (!started) { ctx.moveTo(x, y); started = true; }
    else ctx.lineTo(x, y);
  }
  if (started) ctx.stroke();
}

/* ---------------- 十字光标 + 浮层 ---------------- */
function drawCrosshair(view, viewStart, viewEnd, xAt, yAt, w, h, padL, padR) {
  const { mx, my } = state.crosshair;
  // 垂直线（吸附到最近蜡烛）
  const idx = Math.round((mx - padL) / state.candleW - 0.5) + viewStart;
  if (idx < viewStart || idx >= viewEnd) return;
  const b = view[idx - viewStart];
  const cx = xAt(idx);
  ctx.strokeStyle = "rgba(139,148,158,.7)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(padL, my); ctx.lineTo(w - padR, my); ctx.stroke();
  ctx.setLineDash([]);

  const up = b.c >= b.o;
  const tt = $("tooltip");
  tt.style.display = "block";
  const style = up ? "up" : "down";
  tt.innerHTML = `<b>${b.t}</b><br>` +
    `开 <span class="${style}">${b.o.toFixed(2)}</span>　高 <span class="${style}">${b.h.toFixed(2)}</span><br>` +
    `低 <span class="${style}">${b.l.toFixed(2)}</span>　收 <span class="${style}">${b.c.toFixed(2)}</span><br>` +
    `量 ${b.v}`;
  // 浮层定位（不溢出右侧）
  const rect = canvas.getBoundingClientRect();
  const tx = cx + 14;
  tt.style.left = (tx + 160 > rect.width ? cx - 170 : tx) + "px";
  tt.style.top = (my - 30) + "px";
}

/* ---------------- 交互：缩放 / 平移 / 高度拖拽 ---------------- */
function zoom(factor) {
  state.candleW = Math.max(2, Math.min(40, state.candleW * factor));
  const plotW = chartPlotWidth() - 76;
  const maxVisible = Math.max(4, Math.floor(plotW / state.candleW));
  // 放大时贴右（最新）；缩小时贴回起点显示全部
  if (maxVisible >= state.data.length) state.viewStart = 0;
  else state.viewStart = state.data.length - maxVisible;
  $("candleInfo").textContent = `${state.candleW.toFixed(0)}px/根`;
  renderChart();
}

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2);
}, { passive: false });

canvas.addEventListener("mousedown", (e) => {   // 平移（拖动图表窗口）
  state.dragging = { mode: "pan", startX: e.clientX, startView: state.viewStart };
  canvas.style.cursor = "grabbing";
});
window.addEventListener("mousemove", (e) => {
  if (state.dragging?.mode === "pan") {
    const dx = e.clientX - state.dragging.startX;
    const dIdx = Math.round(dx / state.candleW);
    state.viewStart = state.dragging.startView - dIdx;
    renderChart();
  } else {
    // 十字光标跟随
    const rect = canvas.getBoundingClientRect();
    state.crosshair = { mx: e.clientX - rect.left, my: e.clientY - rect.top };
    if (state.data.length) renderChart();
  }
});
window.addEventListener("mouseup", () => {
  state.dragging = null;
  canvas.style.cursor = "crosshair";
});
canvas.addEventListener("mouseleave", () => {
  state.crosshair = null; $("tooltip").style.display = "none"; renderChart();
});

/* 高度拖拽手柄：按住上下拖动即可自由调整图表高度 */
const handle = $("resizeHandle");
handle.addEventListener("mousedown", (e) => {
  state.dragging = { mode: "height", startY: e.clientY, startH: state.chartHeight };
  handle.classList.add("active");
  e.preventDefault();
});
window.addEventListener("mousemove", (e) => {
  if (state.dragging?.mode === "height") {
    state.chartHeight = Math.max(200, Math.min(720, state.dragging.startH + (e.clientY - state.dragging.startY)));
    canvas.style.height = state.chartHeight + "px";
    renderChart();
  }
});
window.addEventListener("mouseup", () => {
  if (state.dragging?.mode === "height") handle.classList.remove("active");
});

/* 窗口宽度变化自动重绘（自适应清晰） */
new ResizeObserver(() => renderChart()).observe(canvas);

/* ---------------- AI 对话（POST /api/chat，SSE 流式） ---------------- */
const messagesEl = $("messages");
const questionEl = $("question");
const sendBtn = $("sendBtn");

function addMsg(html, cls) {
  const div = document.createElement("div");
  div.className = "msg " + (cls || "ai");
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendQuestion() {
  const q = questionEl.value.trim();
  if (!q || sendBtn.disabled) return;
  if (!state.data.length) { addMsg("请先加载K线数据（点击刷新）。", "err"); return; }

  addMsg(q.replace(/\n/g, "<br>"), "user");
  questionEl.value = "";
  sendBtn.disabled = true;

  // AI 消息容器：label + 思考过程（可折叠，实时更新）+ 回答
  const aiBox = addMsg('<span class="label">🤖 AI 分析中…</span><div class="ai-body"></div>');
  const bodyEl = aiBox.querySelector(".ai-body");
  bodyEl.innerHTML = '<span class="thinking">正在思考，请稍候…</span>';
  let reasoningDiv = null, contentDiv = null, answerText = "";

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, kline: state.data, stats: state.stats }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    // 解析 SSE 流
    const reader = resp.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();                       // 保留不完整尾部
      for (const part of parts) {
        const line = part.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        let ev; try { ev = JSON.parse(payload); } catch { continue; }

        if (ev.type === "reasoning") {
          if (!reasoningDiv) {
            bodyEl.innerHTML = "";
            reasoningDiv = document.createElement("details");
            reasoningDiv.className = "reasoning";
            reasoningDiv.innerHTML = `<summary>🧠 思考过程（实时展开，点击收起）</summary><div class="rc-body"></div>`;
            bodyEl.appendChild(reasoningDiv);
          }
          reasoningDiv.querySelector(".rc-body").textContent += ev.delta;
          reasoningDiv.open = true;
        } else if (ev.type === "content") {
          if (!contentDiv) {
            bodyEl.innerHTML = "";
            if (reasoningDiv) bodyEl.appendChild(reasoningDiv);
            contentDiv = document.createElement("div");
            contentDiv.className = "ai-content";
            bodyEl.appendChild(contentDiv);
          }
          answerText += ev.delta;
          contentDiv.textContent = answerText;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (ev.type === "error") {
          bodyEl.innerHTML = `<span style="color:#fca5a5">❌ ${ev.message}</span>`;
        } else if (ev.type === "done") {
          break;                       // 流结束，主动跳出（服务端已 Connection: close）
        }
      }
    }
    if (!answerText && !reasoningDiv) bodyEl.textContent = "（无回答）";
  } catch (e) {
    bodyEl.innerHTML = `<span style="color:#fca5a5">❌ 请求失败: ${e.message}</span>`;
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener("click", sendQuestion);
questionEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuestion(); }
});
